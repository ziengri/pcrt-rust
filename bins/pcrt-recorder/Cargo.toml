[package]
name = "pcrt-recorder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
opencv-source = ["pcrt-recording/opencv-source"]

[[bin]]
name = "pcrt-recorder"
path = "src/main.rs"
required-features = ["opencv-source"]

[dependencies]
pcrt-recording = { path = "../../crates/pcrt-recording" }
pcrt-service = { path = "../../crates/pcrt-service" }
pcrt-storage = { path = "../../crates/pcrt-storage" }
ctrlc = "3.5.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
zmq = "0.10.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
