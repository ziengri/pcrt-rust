[package]
name = "pcrt-recorder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pcrt-recorder"
path = "src/main.rs"

[dependencies]
pcrt-recording = { path = "../../crates/pcrt-recording" }
pcrt-door-zmq = { path = "../../crates/pcrt-door-zmq" }
pcrt-model = { path = "../../crates/pcrt-model" }
pcrt-service = { path = "../../crates/pcrt-service" }
pcrt-storage = { path = "../../crates/pcrt-storage" }
ctrlc = "3.5.2"
nix = { version = "0.31.3", features = ["fs", "poll"] }
opencv = { version = "0.98", default-features = false, features = ["imgproc", "videoio"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
