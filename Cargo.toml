[workspace]
members = [
    "crates/pcrt-config",
    "crates/pcrt-api-client",
    "crates/pcrt-door",
    "crates/pcrt-door-zmq",
    "crates/pcrt-license",
    "crates/pcrt-license-signing",
    "crates/pcrt-model",
    "crates/pcrt-processing",
    "crates/pcrt-recording",
    "crates/pcrt-result-queue",
    "crates/pcrt-service",
    "crates/pcrt-storage",
    "crates/pcrt-uploader",
    "bins/pcrt-door-gateway",
    "bins/pcrt-license-admin",
    "bins/pcrt-license-tool",
    "bins/pcrt-processor",
    "bins/pcrt-recorder",
    "bins/pcrt-uploader",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "Proprietary"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
