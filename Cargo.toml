[workspace]
members = [
    "crates/pcrt-config",
    "crates/pcrt-api-client",
    "crates/pcrt-door",
    "crates/pcrt-model",
    "crates/pcrt-result-queue",
    "crates/pcrt-service",
    "crates/pcrt-storage",
    "crates/pcrt-uploader",
    "bins/pcrt-door-gateway",
    "bins/pcrt-video-reencode",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Proprietary"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
